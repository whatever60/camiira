[project]
name = "camiira"
version = "0.1.0"
description = "The CAMII readout analysis framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "whatever60", email = "quym@foxmail.com"}]
dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "torch>=2.3.1",
    "networkx<3.0",
    "opencv-python-headless>=4.9.0.80",
    "pillow>=10.1.0",
    "matplotlib>=3.8.3",
    "rich>=13.6.0",
    "polars>=1.1.0",
    "tqdm>=4.66.1",
    "scipy>=1.13.0",
    "scikit-image>=0.23.2",
    "scikit-learn>=1.6.1",
    "dendropy>=4.6.1",
    "transformers>=4.39.1",
    "pycirclize>=1.1.0",
    "biopython>=1.84",
    "joblib>=1.3.2",
    "numba>=0.58.1",
    "python-tsp>=0.5.0",
    "seaborn>=0.13.1",
    "pyyaml>=6.0.1",
    "biom-format>=2.1.15",
]

[project.scripts]
"detect_colonies.py" = "camiira.cli:detect_colonies"
"calc_calib_params.py" = "camiira.cli:calc_calib_params"
"correct_coords.py" = "camiira.cli:correct_coords"
"data_transform.py" = "camiira.cli:data_transform"
"draw_interaction.py" = "camiira.cli:draw_interaction"
"isolate_interaction.py" = "camiira.cli:isolate_interaction"
"select_colonies.py" = "camiira.cli:select_colonies"
