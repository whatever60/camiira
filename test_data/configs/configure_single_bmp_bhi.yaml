# Single 4033 x 2693 BMP acquired from a robot camera over BHI agar.
# This profile was validated without a calibration file.

# Single-image correction
calib_contrast_alpha: 1
calib_contrast_beta: 0

# Crop to the rectangular agar surface
crop_y_min: 220
crop_y_max: 2450
crop_x_min: 220
crop_x_max: 3820

# Background removal
bg_gaussian_kernel: 18
bg_threshold_block_size: 501
bg_threshold_offset: 18
fg_gaussian_kernel: 5
clahe_clip_limit: 2.0
clahe_tile_grid_size: [4, 4]

# Contour detection
canny_upper_percentile: 80

# Quality filtering
min_size: 30
max_size: 2000000
min_circularity: 0.2
max_circularity: 1
small_size_area: 80
small_size_circularity: 0.85
min_convexity: 0.2
max_convexity: 1
min_inertia: 0.2
max_inertia: 1
min_dist: 1
min_dist_pin: 1
circularity_threshold: 0.85
circularity_threshold_very_bad: 0.5

# Multi-colony segmentation
area_segment_min: 30
area_segment_max: 50000
segment_bias: 10
filter_bias: 20
size_sub_sample: 10000
post_min_size: 30
post_min_circularity: 0.5
post_min_convexity: 0.5
post_min_inertia: 0.5
random_walker_beta: 2000
random_walker_method: bf
random_walker_maxi_size: 17

# Farthest-points selection
farthest_points_iteration: 10

# Visualization
plate_qc_colony_contour_pixel: 2
